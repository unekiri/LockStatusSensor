# /etc/mosquitto/conf.d/lockstatus.conf として配置する。
#
# センサー（sender.py）は 1883 の生MQTTで接続し、ブラウザ（LockStatusWeb）は
# WebSocket でしか接続できない。両方のリスナーが必要。

listener 1883
protocol mqtt

listener 9001
protocol websockets

# LAN内前提。外部公開するなら認証とTLSを必ず有効にすること。
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/
